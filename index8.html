<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer | Discover Movies</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            gold: '#F5C518',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
              '50%': { transform: 'translateY(-20px) rotate(2deg)' },
            },
            'float-slow': {
              '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
              '50%': { transform: 'translateY(-30px) rotate(-2deg)' },
            },
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            float: 'float 6s ease-in-out infinite',
            'float-slow': 'float-slow 8s ease-in-out infinite',
            'fade-up': 'fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards',
          },
        },
      },
    };
  </script>
</head>

<body class="bg-[#09090B] text-white min-h-screen flex flex-col antialiased overflow-x-hidden selection:bg-gold selection:text-black">

  <!-- ===== Ambient Background Orbs (Tailwind only) ===== -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-[36rem] h-[36rem] rounded-full bg-gold/[0.07] blur-[140px] animate-float-slow"></div>
    <div class="absolute top-1/3 -right-40 w-[32rem] h-[32rem] rounded-full bg-amber-500/[0.06] blur-[140px] animate-float"></div>
    <div class="absolute -bottom-40 left-1/3 w-[28rem] h-[28rem] rounded-full bg-gold/[0.05] blur-[120px] animate-float-slow"></div>
  </div>

  <!-- ================= NAVBAR ================= -->
  <header class="sticky top-0 z-50">
    <nav class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10">
      <div class="mt-4 flex items-center justify-between
                  rounded-2xl bg-white/[0.03] backdrop-blur-xl
                  border border-white/[0.08]
                  shadow-[0_8px_40px_-12px_rgba(0,0,0,0.6)]
                  px-4 sm:px-5 h-16">

        <!-- Logo -->
        <a href="index.html" class="group flex items-center gap-3">
          <span class="relative grid place-items-center w-10 h-10 rounded-2xl
                       bg-gradient-to-br from-gold via-amber-400 to-amber-600
                       shadow-[0_10px_30px_-8px_rgba(245,197,24,0.5)]
                       ring-1 ring-white/10
                       transition duration-300
                       group-hover:scale-110 group-hover:rotate-6">
            <span class="text-lg leading-none drop-shadow">🎬</span>
           
          </span>
          <span class="text-lg sm:text-xl font-extrabold tracking-tight">
            Movie<span class="text-gold">Explorer</span>
          </span>
        </a>

       

        <!-- Movies CTA -->
        <a href="browse.html"
           class="group inline-flex items-center gap-2
                  px-4 sm:px-5 py-2.5 rounded-xl
                  bg-gold text-black text-sm font-bold
                  shadow-lg shadow-gold/25
                  hover:shadow-gold/40 hover:scale-[1.03]
                  transition duration-300">
          Movies
          <svg class="w-4 h-4 group-hover:translate-x-0.5 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      </div>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="relative z-10 flex-1">

    <!-- ================= HERO ================= -->
    <section class="relative min-h-[calc(100vh-96px)] flex items-center overflow-hidden">

      <!-- Background -->
      <div class="absolute inset-0">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=2000&q=80"
             alt=""
             class="w-full h-full object-cover opacity-[0.18] scale-105">
        <div class="absolute inset-0 bg-gradient-to-r from-[#09090B] via-[#09090B]/95 to-[#09090B]/50"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#09090B] via-transparent to-[#09090B]/80"></div>
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,#09090B_85%)]"></div>
      </div>

      <!-- Content -->
      <div class="relative z-10 max-w-7xl mx-auto w-full px-5 sm:px-8 lg:px-10 py-16 lg:py-20">
        <div class="grid lg:grid-cols-12 gap-12 lg:gap-10 items-center">

          <!-- LEFT -->
          <div class="lg:col-span-7 animate-fade-up">

            <!-- Badge -->
            <div class="inline-flex items-center gap-2.5
                        px-3.5 py-1.5 rounded-full
                        bg-white/[0.04] backdrop-blur-sm
                        border border-white/[0.08]">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-gold"></span>
              </span>
              <span class="text-xs font-semibold tracking-widest text-gray-300 uppercase text-center">
               Discover  Movies.
              </span>
            </div>

          


        <h1
          class="mt-4
                 text-4xl sm:text-5xl lg:text-6xl
                 font-bold
                 leading-tight"
        >
          Explore Your
          <span class="text-[#F5C518]">
            Favorite Movies
          </span>
        </h1>


        <p
          class="mt-6
                 text-gray-400
                 text-base sm:text-lg
                 leading-relaxed"
        >
          Explore and discover your favorite movies
          from around the world.
        </p>


        <!-- CTA -->
        <a
          href="/movies"
          class="inline-block
                 mt-8
                 px-6 py-3
                 bg-[#F5C518]
                 text-black
                 font-bold
                 rounded-lg
                 hover:bg-yellow-400
                 hover:scale-105
                 transition"
        >
          Explore Now   <svg class="w-5 h-5 group-hover:translate-x-1 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
        </a>

      </div>



            <!-- Stats -->
            <div class="mt-14 pt-8 border-t border-white/[0.06]
                        grid grid-cols-3 gap-6 max-w-lg">
              <div>
                <div class="text-2xl sm:text-3xl font-black text-white">
                  12K<span class="text-gold">+</span>
                </div>
                <div class="mt-1 text-xs sm:text-sm text-gray-500 font-medium">Movies</div>
              </div>
              <div>
                <div class="text-2xl sm:text-3xl font-black text-white">
                  4.9<span class="text-gold">★</span>
                </div>
                <div class="mt-1 text-xs sm:text-sm text-gray-500 font-medium">Rating</div>
              </div>
              <div>
                <div class="text-2xl sm:text-3xl font-black text-white">
                  2M<span class="text-gold">+</span>
                </div>
                <div class="mt-1 text-xs sm:text-sm text-gray-500 font-medium">Users</div>
              </div>
            </div>
          </div>

          <!-- RIGHT: Floating Posters -->
          <div class="hidden lg:block lg:col-span-5 relative h-[560px] animate-fade-up">

            <!-- Poster 1 -->
            <div class="absolute top-0 left-4 w-52 -rotate-[8deg]
                        rounded-2xl overflow-hidden
                        ring-1 ring-white/10
                        shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8)]
                        animate-float-slow
                        hover:z-30 hover:scale-105 hover:rotate-0
                        transition duration-500">
              <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80"
                   class="w-full h-80 object-cover" alt="">
              <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
            </div>

            <!-- Poster 2 (Center) -->
            <div class="absolute top-16 left-1/2 -translate-x-1/2 w-60 z-20
                        rounded-2xl overflow-hidden
                        ring-1 ring-white/15
                        shadow-[0_40px_80px_-20px_rgba(245,197,24,0.35)]
                        animate-float
                        hover:z-30 hover:scale-105
                        transition duration-500">
              <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=600&q=80"
                   class="w-full h-96 object-cover" alt="">
              <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/10 to-transparent"></div>
              <div class="absolute bottom-0 left-0 right-0 p-4">
                <div class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md
                            bg-gold text-black text-[10px] font-black tracking-wider uppercase">
                  Top Rated
                </div>
                <div class="mt-2 text-white font-bold text-sm leading-tight">
                  Cinematic Masterpiece
                </div>
              </div>
            </div>

            <!-- Poster 3 -->
            <div class="absolute top-24 right-4 w-52 rotate-[8deg]
                        rounded-2xl overflow-hidden
                        ring-1 ring-white/10
                        shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8)]
                        animate-float-slow
                        hover:z-30 hover:scale-105 hover:rotate-0
                        transition duration-500">
              <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=600&q=80"
                   class="w-full h-80 object-cover" alt="">
              <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
            </div>

            <!-- Ambient glow -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
                        w-80 h-80 rounded-full bg-gold/20 blur-[100px] -z-10"></div>
          </div>

        </div>
      </div>

      <!-- Scroll hint -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 hidden sm:flex
                  flex-col items-center gap-2 text-gray-600">
        <span class="text-[10px] tracking-widest uppercase font-semibold">Scroll</span>
        <div class="w-px h-8 bg-gradient-to-b from-gray-600 to-transparent"></div>
      </div>

    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="relative z-10 border-t border-white/[0.06]">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10 py-8
                flex flex-col sm:flex-row items-center justify-between gap-4">

      <a href="index.html" class="group flex items-center gap-2.5">
        <span class="grid place-items-center w-9 h-9 rounded-xl
                     bg-gradient-to-br from-gold via-amber-400 to-amber-600
                     shadow-[0_8px_20px_-6px_rgba(245,197,24,0.5)]
                     transition group-hover:scale-105">
          <span class="text-base leading-none">🎬</span>
        </span>
        <span class="font-extrabold tracking-tight">
          Movie<span class="text-gold">Explorer</span>
        </span>
      </a>

      <p class="text-xs sm:text-sm text-gray-500 text-center order-3 sm:order-2">
        © 2026 MovieExplorer. All rights reserved.
      </p>

      <div class="flex items-center gap-5 order-2 sm:order-3">
        <a href="#" class="text-gray-400 hover:text-gold transition text-sm font-medium">GitHub</a>
        <a href="#" class="text-gray-400 hover:text-gold transition text-sm font-medium">Twitter</a>
      </div>
    </div>
  </footer>

</body>
</html>
