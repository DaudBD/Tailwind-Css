<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Explorer | Home</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body
  class="bg-[#09090B]
         text-white
         min-h-screen
         flex flex-col
         antialiased
         overflow-x-hidden
         selection:bg-[#F5C518]
         selection:text-black"
>


  <!-- ================= NAVBAR ================= -->

  <header
    class="bg-[#27272A]
           border-b
           border-[#3F3F46]"
  >

    <nav
      class="max-w-7xl
             mx-auto
             px-4
             sm:px-6
             lg:px-8
             h-16
             sm:h-[72px]
             flex
             items-center
             justify-between"
    >


      <!-- ================= LOGO ================= -->

      <a
        href="index.html"
        class="flex
               items-center
               gap-1.5
               text-xl
               sm:text-2xl
               font-extrabold
               tracking-tight"
      >

        <span class="text-lg sm:text-xl">
          🎬
        </span>

        <span class="text-white">
          MOVIE
        </span>

        <span class="text-[#F5C518]">
          EXPLORER
        </span>

      </a>



      <!-- ================= MOVIES BUTTON ================= -->

      <a
        href="movies.html"
        class="group
               inline-flex
               items-center
               gap-2
               px-4
               py-2
               sm:px-5
               sm:py-2.5
               rounded-lg
               bg-[#F5C518]
               text-black
               text-sm
               sm:text-base
               font-bold
               shadow-md
               shadow-black/20
               hover:bg-[#FFD43B]
               hover:-translate-y-0.5
               transition-all
               duration-300"
      >

        <span>
          Movies
        </span>


        <!-- Arrow -->

        <svg
          class="w-4
                 h-4
                 group-hover:translate-x-1
                 transition-transform
                 duration-300"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M5 12h14"></path>

          <path d="M13 6l6 6-6 6"></path>

        </svg>

      </a>


    </nav>

  </header>



  <!-- ================= MAIN ================= -->

  <main class="flex-1">


    <!-- ================= HERO BANNER ================= -->

    <section
      class="relative
             min-h-[calc(100vh-72px)]
             flex
             items-center
             justify-center
             text-center
             px-4
             overflow-hidden"
    >


      <!-- ================= BACKGROUND ================= -->

      <div
        class="absolute
               inset-0
               bg-gradient-to-b
               from-[#18181B]
               via-[#0F0F12]
               to-[#09090B]"
      ></div>



      <!-- ================= GOLD GLOW ================= -->

      <div
        class="absolute
               top-[-100px]
               left-1/2
               -translate-x-1/2
               w-72
               h-72
               sm:w-96
               sm:h-96
               rounded-full
               bg-[#F5C518]/10
               blur-3xl"
      ></div>



      <!-- ================= SECOND GLOW ================= -->

      <div
        class="absolute
               bottom-[-150px]
               right-[-100px]
               w-72
               h-72
               sm:w-96
               sm:h-96
               rounded-full
               bg-[#F5C518]/5
               blur-3xl"
      ></div>



      <!-- ================= HERO CONTENT ================= -->

      <div
        class="relative
               z-10
               w-full
               max-w-3xl
               mx-auto"
      >


        <!-- ================= BADGE ================= -->

        <div
          class="inline-flex
                 items-center
                 gap-2.5
                 px-4
                 py-2
                 rounded-full
                 bg-[#18181B]
                 border
                 border-[#3F3F46]
                 shadow-lg
                 shadow-black/20"
        >


          <!-- Animated Dot -->

          <span class="relative flex h-2 w-2">

            <span
              class="absolute
                     inline-flex
                     h-full
                     w-full
                     rounded-full
                     bg-[#F5C518]
                     opacity-60
                     animate-ping"
            ></span>

            <span
              class="relative
                     inline-flex
                     h-2
                     w-2
                     rounded-full
                     bg-[#F5C518]"
            ></span>

          </span>



          <!-- Badge Text -->

          <span
            class="text-[11px]
                   sm:text-xs
                   font-bold
                   tracking-[0.18em]
                   text-[#A1A1AA]
                   uppercase"
          >
            Discover Movies
          </span>

        </div>



        <!-- ================= HEADING ================= -->

        <h1
          class="mt-6
                 text-4xl
                 sm:text-5xl
                 md:text-6xl
                 lg:text-7xl
                 font-extrabold
                 leading-[1.05]
                 tracking-tight"
        >

          Explore Your

          <span
            class="block
                   mt-1
                   text-[#F5C518]"
          >
            Favorite Movies
          </span>

        </h1>



        <!-- ================= DESCRIPTION ================= -->

        <p
          class="mt-6
                 max-w-xl
                 mx-auto
                 text-[#A1A1AA]
                 text-sm
                 sm:text-base
                 lg:text-lg
                 leading-7"
        >

          Explore and discover your favorite movies
          from around the world and find something
          exciting to watch.

        </p>



        <!-- ================= CTA ================= -->

        <div class="mt-8">

          <a
            href="movies.html"
            class="inline-flex
                   items-center
                   justify-center
                   gap-2
                   px-6
                   py-3.5
                   sm:px-8
                   sm:py-4
                   rounded-xl
                   bg-[#F5C518]
                   text-black
                   text-sm
                   sm:text-base
                   font-extrabold
                   shadow-xl
                   shadow-[#F5C518]/10
                   hover:bg-[#FFD43B]
                   hover:shadow-[#F5C518]/25
                   hover:-translate-y-1
                   transition-all
                   duration-300"
          >

            <span>
              Explore Now
            </span>


            <!-- Arrow -->

            <svg
              class="w-5
                     h-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <path d="M5 12h14"></path>

              <path d="M13 6l6 6-6 6"></path>

            </svg>

          </a>

        </div>


      </div>

    </section>

  </main>



  <!-- ================= FOOTER ================= -->

  <footer
    class="bg-[#18181B]
           border-t
           border-[#3F3F46]"
  >

    <div
      class="max-w-7xl
             mx-auto
             px-4
             sm:px-6
             lg:px-8
             py-6
             flex
             flex-col
             sm:flex-row
             items-center
             justify-between
             gap-4"
    >


      <!-- ================= APPLICATION NAME ================= -->

      <p
        class="text-2xl
               sm:text-base
               font-bold"
      >

        <span class="text-white">
          Movie
        </span>

        <span class="text-[#F5C518]">
          Explorer
        </span>

      </p>



      <!-- ================= COPYRIGHT ================= -->

      <p
        class="text-xs
               sm:text-sm
               text-[#71717A]
               text-center"
      >

        © 2026 MovieExplorer. All rights reserved.

      </p>



      <!-- ================= GITHUB ================= -->

      <a
        href="#"
        class="text-sm
               text-[#A1A1AA]
               hover:text-[#F5C518]
               transition-colors
               duration-300"
      >

        GitHub

      </a>


    </div>

  </footer>


</body>

</html>
